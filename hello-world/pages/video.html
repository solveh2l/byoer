<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BYOER - Bring Your Own Escape Room - Intro Video">
    <title>BYOER - Ship of the Damned | Intro Video</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090a0f;
            --text-main: #f0f3f9;
            --accent-cyan: #00f0ff;
            --accent-purple: #9d4edd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
            border: none;
        }

        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at center, rgba(0, 240, 255, 0.3), transparent);
            border: 2px solid var(--accent-cyan);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 10;
        }

        .play-button.visible {
            opacity: 1;
            pointer-events: all;
        }

        .play-icon {
            width: 0;
            height: 0;
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            border-left: 30px solid var(--accent-cyan);
            margin-left: 5px;
        }

        .text-overlay {
            position: absolute;
            bottom: 20vh;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #fff;
            font-size: 1.8rem;
            font-family: 'Cinzel', serif;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
            max-width: 90%;
            line-height: 1.3;
            z-index: 5;
            padding: 0 1rem;
        }

        .progress-bar {
            position: absolute;
            bottom: 8vh;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            transition: width 0.1s linear;
        }

        .fade-in {
            animation: fadeIn 1.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            .text-overlay {
                font-size: 1.4rem;
                bottom: 15vh;
            }
            
            .play-button {
                width: 90px;
                height: 90px;
            }
            
            .play-icon {
                border-top: 15px solid transparent;
                border-bottom: 15px solid transparent;
                border-left: 22px solid var(--accent-cyan);
            }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="background-video" autoplay muted loop>
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <div class="text-overlay fade-in">
        The SS Endurance drifts through the cursed waters of the Sargasso Sea.<br>
        The crew vanished without a trace, leaving only whispers in the fog.<br>
        Can you uncover what happened before the ship claims you too?
    </div>

    <div class="progress-bar">
        <div class="progress" id="progress-bar"></div>
    </div>

    <div class="play-button" id="play-button">
        <div class="play-icon"></div>
    </div>

    <script>
        const video = document.getElementById('background-video');
        const playButton = document.getElementById('play-button');
        const progressBar = document.getElementById('progress-bar');

        // Update progress bar
        function updateProgress() {
            if (video.duration) {
                const percent = (video.currentTime / video.duration) * 100;
                progressBar.style.width = percent + '%';
            }
        }

        // Show play button
        function showPlayButton() {
            playButton.classList.add('visible');
            playButton.innerHTML = '<div class="play-icon"></div><span style="margin-left: 8px; font-size: 1rem;">PLAY NOW</span>';
        }

        // Handle click on play button
        function handlePlayClick() {
            window.location.href = 'room';
        }

        // Event listeners
        video.addEventListener('timeupdate', updateProgress);
        video.addEventListener('ended', showPlayButton);

        // Fallback: show PLAY button after 5 seconds regardless of autoplay success
        setTimeout(showPlayButton, 5000);

        // Fallback: show PLAY button on any user click (clicks anywhere on the page)
        document.addEventListener('click', function() {
            video.play().catch(e => {
                console.log('Autoplay blocked, showing button');
                showPlayButton();
            });
        }, { once: true });

        playButton.addEventListener('click', handlePlayClick);
    </script>
</body>
</html>
