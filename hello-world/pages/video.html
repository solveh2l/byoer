<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BYOER - Bring Your Own Escape Room - Intro Video">
    <title>BYOER - Escape from Alcatraz | Intro Video</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090a0f;
            --text-main: #f0f3f9;
            --accent-cyan: #00f0ff;
            --accent-purple: #9d4edd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        video {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            object-fit: cover;
            display: block;
            border: none;
        }

        /* On portrait phones, show the whole frame instead of cropping it */
        @media (orientation: portrait) {
            video {
                object-fit: contain;
            }
        }

        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .video-container::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.45) 28%, transparent 62%);
            pointer-events: none;
            z-index: 2;
        }

        .play-button {
            position: absolute;
            top: auto;
            bottom: 12vh;
            left: 50%;
            transform: translateX(-50%);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 1.2rem 3rem;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
            white-space: nowrap;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.2s, box-shadow 0.2s;
            pointer-events: none;
            z-index: 10;
        }

        .play-button.visible {
            opacity: 1;
            pointer-events: all;
        }

        .play-button.visible:hover {
            transform: translateX(-50%) translateY(-3px);
            box-shadow: 0 0 35px rgba(157, 78, 221, 0.5);
        }

        .play-icon {
            width: 0;
            height: 0;
            border-top: 11px solid transparent;
            border-bottom: 11px solid transparent;
            border-left: 17px solid #fff;
            margin-left: 2px;
        }

        .text-overlay {
            position: absolute;
            bottom: 28vh;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #fff;
            font-size: 1.6rem;
            font-family: 'Cinzel', serif;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
            max-width: min(90%, 660px);
            line-height: 1.35;
            z-index: 5;
            padding: 1.2rem 1.6rem;
            background: rgba(9, 10, 15, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            backdrop-filter: blur(8px);
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        .text-overlay.visible {
            opacity: 1;
        }

        .progress-bar {
            position: absolute;
            bottom: 8vh;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            transition: width 0.1s linear;
        }

        .fade-in {
            animation: fadeIn 1.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            .text-overlay {
                font-size: 1.15rem;
                bottom: 27vh;
                letter-spacing: 1px;
            }

            .play-button {
                bottom: 10vh;
                padding: 1rem 2.2rem;
                font-size: 1rem;
            }

            .play-icon {
                border-top: 9px solid transparent;
                border-bottom: 9px solid transparent;
                border-left: 14px solid #fff;
            }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="background-video" autoplay muted playsinline preload="auto">
            <source src="/media/intro.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <div class="text-overlay" id="text-overlay">
        The most infamous prison on the planet.<br>
        A brutal regime guards the docks, and the guards never sleep.<br>
        Can you escape before the lockdown seals your fate?
    </div>

    <div class="progress-bar">
        <div class="progress" id="progress-bar"></div>
    </div>

    <div class="play-button" id="play-button">
        <div class="play-icon"></div>
    </div>

    <script>
        const video = document.getElementById('background-video');
        const playButton = document.getElementById('play-button');
        const progressBar = document.getElementById('progress-bar');
        const textOverlay = document.getElementById('text-overlay');

        // Update progress bar
        function updateProgress() {
            if (video.duration) {
                const percent = (video.currentTime / video.duration) * 100;
                progressBar.style.width = percent + '%';
            }
        }

        // Reveal the story text + PLAY button when the intro finishes
        function revealEnd() {
            playButton.classList.add('visible');
            playButton.innerHTML = '<div class="play-icon"></div><span>PLAY NOW</span>';
            textOverlay.classList.add('visible');
        }

        // Handle click on play button
        function handlePlayClick() {
            window.location.href = 'room';
        }

        // Event listeners
        video.addEventListener('timeupdate', updateProgress);
        video.addEventListener('ended', revealEnd);
        video.addEventListener('error', revealEnd);

        // Start playback. If the browser blocks autoplay, reveal controls so players aren't stuck.
        video.play().catch(revealEnd);

        // Fallback: a tap anywhere starts the video if it hasn't begun playing yet
        document.addEventListener('click', function() {
            if (video.paused && !video.ended) {
                video.play().catch(revealEnd);
            }
        }, { once: true });

        playButton.addEventListener('click', handlePlayClick);
    </script>
</body>
</html>
