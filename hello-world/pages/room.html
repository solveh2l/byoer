<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BYOER - Bring Your Own Escape Room - Escape Room Scene">
    <title>BYOER - Escape from Alcatraz | Escape Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090a0f;
            --panel-bg: rgba(18, 20, 29, 0.85);
            --accent-cyan: #00f0ff;
            --accent-purple: #9d4edd;
            --accent-green: #00ff9d;
            --accent-red: #ff4444;
            --text-main: #f0f3f9;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            color: var(--text-main);
        }

        /* Room Background */
        .room-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background: #090a0f;
            overflow: hidden;
            cursor: pointer;
            z-index: 0;
        }

        .room-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.35) 0%, rgba(22, 33, 62, 0.25) 40%, rgba(15, 15, 26, 0.45) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .room-bg.flash::after {
            background: radial-gradient(circle at center, rgba(0, 255, 157, 0.3) 0%, transparent 70%);
        }

        .room-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        .room-img-blur {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            filter: blur(40px) brightness(1) saturate(1);
            transform: scale(1.2);
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* On portrait phones, show the whole scene instead of cropping it */
        @media (orientation: portrait) {
            .room-img {
                object-fit: contain;
            }
        }

        .fog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100"><rect width="200" height="100" fill="none"/><circle cx="20" cy="50" r="20" fill="white" opacity="0.03"/><circle cx="80" cy="30" r="15" fill="white" opacity="0.03"/><circle cx="150" cy="60" r="25" fill="white" opacity="0.03"/></svg>');
            z-index: 1;
            pointer-events: none;
        }

        .timer-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            z-index: 20;
        }

        .timer-progress {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-red));
            transition: width 1s linear;
        }

        .timer-text {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 30;
            font-family: 'Space Mono', 'Courier New', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-cyan);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }

        .timer-text.warning {
            color: var(--accent-red);
            text-shadow: 0 0 15px rgba(255, 68, 68, 0.5);
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .room-header {
            position: fixed;
            top: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        .room-label {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            color: var(--accent-purple);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.3rem;
        }

        .room-name {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .room-stage {
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            color: var(--accent-cyan);
            letter-spacing: 1px;
            margin-top: 0.3rem;
            text-transform: uppercase;
        }

        .stage-hint {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 12px;
            padding: 0.8rem 2rem;
            color: var(--text-main);
            font-size: 1rem;
            backdrop-filter: blur(10px);
        }

        .stage-hint span {
            color: var(--accent-cyan);
            font-weight: 700;
        }

        /* Nickname Modal */
        .nickname-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .nickname-modal {
            background: var(--panel-bg);
            border: 2px solid var(--accent-cyan);
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.3);
        }

        .nickname-modal h2 {
            font-family: 'Cinzel', serif;
            color: var(--accent-cyan);
            margin-bottom: 1rem;
            font-size: 1.8rem;
        }

        .nickname-modal p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .nickname-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 0.8rem 1rem;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            margin-bottom: 1rem;
            outline: none;
            text-align: center;
        }

        .nickname-input:focus {
            border-color: var(--accent-cyan);
        }

        .nickname-suggestions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .nickname-suggestion {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 20px;
            padding: 0.4rem 1rem;
            color: var(--accent-cyan);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nickname-suggestion:hover {
            background: rgba(0, 240, 255, 0.2);
        }

        .nickname-join-btn {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.9rem 2rem;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .nickname-join-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(157, 78, 221, 0.5);
        }

        @media (max-width: 768px) {
            .timer-text {
                font-size: 1.2rem;
                top: 0.5rem;
                right: 0.5rem;
            }
            
            .room-name {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="nickname-overlay" id="nickname-overlay">
        <div class="nickname-modal">
            <h2>Choose Your Alias</h2>
            <p>Enter a nickname or pick one below</p>
            <input type="text" class="nickname-input" id="nickname-input" maxlength="20" placeholder="Enter nickname">
            <div class="nickname-suggestions" id="nickname-suggestions"></div>
            <button class="nickname-join-btn" onclick="joinRoom()">Join Room</button>
        </div>
    </div>

    <div class="room-bg" id="room-bg">
        <img class="room-img-blur" id="room-img-blur" src="/images/cell-block.jpg" alt="" aria-hidden="true">
        <img class="room-img" id="room-img" src="/images/cell-block.jpg" alt="Cell Block">
    </div>
    <div class="fog-overlay"></div>

    <div class="timer-bar">
        <div class="timer-progress" id="timer-progress"></div>
    </div>

    <div class="timer-text" id="timer-text">60:00</div>

    <div class="room-header">
        <div class="room-label">🏫 Location: <span>Prison</span>  •  ⛓️ Theme: <span>Alcatraz</span></div>
        <div class="room-name" id="room-name">Cell Block</div>
        <div class="room-stage" id="room-stage">STAGE 1 OF 3</div>
    </div>

    <div class="stage-hint" id="stage-hint">
        <span>Click</span> to solve this area and advance
    </div>

    <script>
        // Pre-curated nicknames
        const allNicknames = [
            'Captain Hook', 'First Mate', 'Navigator', 'Engineer',
            'Shadow', 'Echo', 'Cipher', 'The Locksmith',
            'Warden Steele', 'Dr. Lockwood', 'Guard Vance',
            'The Breaker', 'Iron Will', 'Night Watch'
        ];

        // Check if user is the host (has name from lobby) or a friend
        const isHost = sessionStorage.getItem('hostName') !== null;

        if (isHost) {
            // Host already set their name in lobby - skip modal, go straight to room
            document.getElementById('nickname-overlay').style.display = 'none';
        } else {
            // Friend - show nickname modal
            const shuffled = allNicknames.sort(() => Math.random() - 0.5);
            const suggestions = shuffled.slice(0, 3);
            const suggestionsEl = document.getElementById('nickname-suggestions');
            suggestions.forEach(name => {
                const chip = document.createElement('span');
                chip.className = 'nickname-suggestion';
                chip.textContent = name;
                chip.onclick = () => {
                    document.getElementById('nickname-input').value = name;
                };
                suggestionsEl.appendChild(chip);
            });

            // Pre-fill a random name
            document.getElementById('nickname-input').value = shuffled[3];

            document.getElementById('nickname-overlay').style.display = 'flex';
        }

        function joinRoom() {
            const name = document.getElementById('nickname-input').value.trim();
            if (name) {
                sessionStorage.setItem('playerName', name);
            } else {
                sessionStorage.setItem('playerName', allNicknames[Math.floor(Math.random() * allNicknames.length)]);
            }
            document.getElementById('nickname-overlay').style.display = 'none';
        }

        let currentStage = 1;
        const TOTAL_TIME = 60 * 60;
        let timeLeft = TOTAL_TIME;
        let timerInterval = null;
        let timeUp = false;

        const roomBg = document.getElementById('room-bg');
        const roomImg = document.getElementById('room-img');
        const roomImgBlur = document.getElementById('room-img-blur');
        const roomName = document.getElementById('room-name');
        const roomStage = document.getElementById('room-stage');
        const stageHint = document.getElementById('stage-hint');
        const timerText = document.getElementById('timer-text');
        const timerProgress = document.getElementById('timer-progress');

        const stages = {
            1: 'Cell Block',
            2: 'Prison Courtyard',
            3: 'Docks'
        };

        const stageImages = {
            1: '/images/cell-block.jpg',
            2: '/images/prison-courtyard.jpg',
            3: '/images/docks.jpg'
        };

        if (!sessionStorage.getItem('escapeStartTime')) {
            sessionStorage.setItem('escapeStartTime', Date.now());
        }

        function updateTimer() {
            if (timeLeft <= 0 || timeUp) {
                clearInterval(timerInterval);
                timerText.textContent = "00:00";
                timerProgress.style.width = "0%";
                if (!timeUp) {
                    timeUp = true;
                    alert("Time's up! You didn't escape in time...");
                }
                return;
            }

            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerText.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            const percent = (timeLeft / TOTAL_TIME) * 100;
            timerProgress.style.width = percent + '%';

            if (percent < 10) {
                timerText.classList.add('warning');
            } else {
                timerText.classList.remove('warning');
            }

            timeLeft--;
        }

        function advanceStage() {
            if (currentStage < 3) {
                currentStage++;
                roomImg.src = stageImages[currentStage];
                roomImgBlur.src = stageImages[currentStage];
                roomName.textContent = stages[currentStage];
                roomStage.textContent = `STAGE ${currentStage} OF 3`;

                roomBg.classList.add('flash');
                setTimeout(() => {
                    roomBg.classList.remove('flash');
                }, 500);
            } else {
                window.location.href = 'victory';
            }
        }

        document.addEventListener('click', advanceStage);

        updateTimer();
        timerInterval = setInterval(updateTimer, 1000);
    </script>
</body>
</html>
