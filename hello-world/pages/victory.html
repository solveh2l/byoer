<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BYOER - Bring Your Own Escape Room - Victory">
    <title>BYOER - Escape from Alcatraz | Victory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090a0f;
            --panel-bg: rgba(18, 20, 29, 0.85);
            --accent-cyan: #00f0ff;
            --accent-purple: #9d4edd;
            --accent-green: #00ff9d;
            --text-main: #f0f3f9;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background: linear-gradient(135deg, #090a0f 0%, #1a1a2e 40%, #16213e 100%);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .victory-container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }

        .trophy {
            font-size: 6rem;
            margin-bottom: 1.5rem;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .victory-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 5vw, 3rem);
            color: var(--accent-green);
            text-shadow: 0 0 30px rgba(0, 255, 157, 0.5);
            margin-bottom: 1rem;
        }

        .victory-subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .stats {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 255, 157, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
        }

        .stats h3 {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-cyan);
            margin-bottom: 1rem;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: var(--text-muted);
        }

        .stat-value {
            color: var(--accent-cyan);
            font-weight: 700;
        }

        /* Leaderboard */
        .leaderboard {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 12px;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .leaderboard h3 {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-cyan);
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .player-row {
            display: flex;
            align-items: center;
            padding: 0.8rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
        }

        .player-row:last-child {
            border-bottom: none;
        }

        .player-row:hover {
            background: rgba(0, 240, 255, 0.05);
        }

        .player-rank {
            width: 40px;
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent-purple);
        }

        .player-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--accent-cyan);
            margin-right: 0.8rem;
            object-fit: cover;
        }

        .player-name {
            flex: 1;
            font-weight: 600;
        }

        .player-score {
            color: var(--accent-green);
            font-weight: 700;
            margin-right: 1rem;
        }

        .player-time {
            color: var(--text-muted);
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 1rem 2.5rem;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 35px rgba(157, 78, 221, 0.5);
        }

        .confetti {
            position: fixed;
            top: -10px;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            animation: fall 3s linear infinite;
            z-index: 100;
        }

        @keyframes fall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="victory-container">
        <div class="trophy">🏆</div>
        <h1 class="victory-title">You Escaped!</h1>
        <p class="victory-subtitle">
            Against the odds, you made it out of Alcatraz.<br>
            The boat cuts through the night water,<br>
            and freedom is finally within reach.
        </p>

        <div class="stats">
            <h3>Escape Report</h3>
            <div class="stat-row">
                <span class="stat-label">Areas Cleared</span>
                <span class="stat-value">3 / 3</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Escape Time</span>
                <span class="stat-value" id="escape-time">--:--</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Status</span>
                <span class="stat-value" style="color: var(--accent-green);">FREEDOM</span>
            </div>
        </div>

        <div class="leaderboard">
            <h3>Party Performance</h3>
            <div class="player-row">
                <span class="player-rank">1</span>
                <img class="player-avatar" src="https://i.pravatar.cc/40?img=1" alt="">
                <span class="player-name"><span id="host-name-display"></span> <em style="font-size:0.75rem;color:var(--accent-green);">(Host)</em></span>
                <span class="player-score">3 puzzles</span>
                <span class="player-time" id="host-time">0:00</span>
            </div>
            <div class="player-row" id="player-1-row" style="display:none;">
                <span class="player-rank">2</span>
                <img class="player-avatar" src="https://i.pravatar.cc/40?img=3" alt="">
                <span class="player-name" id="player-1-name"></span>
                <span class="player-score">0 puzzles</span>
                <span class="player-time">0:00</span>
            </div>
        </div>

        <button class="btn" onclick="playAgain()">Replay Escape</button>
    </div>

    <script>
        // Display host name
        const hostName = sessionStorage.getItem('hostName') || 'Host';
        document.getElementById('host-name-display').textContent = hostName;

        // Calculate escape time from room session
        let escapeTime = '--:--';
        if (sessionStorage.getItem('escapeStartTime')) {
            const elapsed = Math.floor((Date.now() - parseInt(sessionStorage.getItem('escapeStartTime'))) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            escapeTime = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            document.getElementById('escape-time').textContent = escapeTime;
            document.getElementById('host-time').textContent = escapeTime;
        }

        // Show player if they joined
        const playerName = sessionStorage.getItem('playerName');
        if (playerName) {
            const playerRow = document.getElementById('player-1-row');
            playerRow.style.display = 'flex';
            document.getElementById('player-1-name').textContent = playerName;
        }

        // Confetti effect
        const colors = ['#00f0ff', '#9d4edd', '#00ff9d', '#ff4444', '#ffaa00'];
        for (let i = 0; i < 50; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDelay = Math.random() * 2 + 's';
            confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
            document.body.appendChild(confetti);
        }

        function playAgain() {
            sessionStorage.removeItem('escapeStartTime');
            window.location.href = 'lobby';
        }
    </script>
</body>
</html>
